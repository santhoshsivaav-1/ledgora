name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API tests run against a real Postgres (row-level security can not be mocked).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgora
          POSTGRES_PASSWORD: ledgora
          POSTGRES_DB: ledgora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgora -d ledgora" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ledgora:ledgora@localhost:5432/ledgora
    steps:
      - uses: actions/checkout@v7

      # Reads the exact pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Drives the real app in Firefox (slow, so not on every pull request). Runs on pushes to main
  # and on demand: Actions > CI > Run workflow.
  smoke:
    name: Browser smoke test (legacy app)
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ledgora/web build
      - run: pnpm --filter @ledgora/legacy-server exec playwright install --with-deps firefox
      - run: pnpm --filter @ledgora/legacy-server test:smoke
